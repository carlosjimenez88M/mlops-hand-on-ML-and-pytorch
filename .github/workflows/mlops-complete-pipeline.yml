name: MLOps CI/CD Pipeline

on:
  pull_request:
    branches: [main, master, cap2-end_to_end]
    paths:
      - "cap2-end_to_end/**"
      - ".github/workflows/mlops-complete-pipeline.yml"
      - ".github/workflows/mlops-model-monitoring.yml"
  push:
    branches: [main, master, cap2-end_to_end]
    paths:
      - "cap2-end_to_end/**"
      - ".github/workflows/mlops-complete-pipeline.yml"
      - ".github/workflows/mlops-model-monitoring.yml"
  workflow_dispatch:
    inputs:
      run_training_pipeline:
        description: "Run full 7-step pipeline in GCP/W&B"
        required: true
        type: boolean
        default: false
      sweep_count:
        description: "W&B Bayesian sweep runs (step 06)"
        required: true
        type: string
        default: "20"
      promote_to_production:
        description: "Promote latest Staging model to Production after registration"
        required: true
        type: boolean
        default: false
      min_r2:
        description: "Promotion guardrail: minimum r2 tag"
        required: true
        type: string
        default: "0.40"
      max_mape:
        description: "Promotion guardrail: maximum mape tag"
        required: true
        type: string
        default: "30.0"

permissions:
  contents: read
  id-token: write

env:
  WORKING_DIR: "cap2-end_to_end"
  PYTHON_VERSION: "3.12"
  WANDB_PROJECT: "housing-mlops-gcp"

concurrency:
  group: mlops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: uv sync --extra dev --extra api --frozen

      - name: Ruff lint
        working-directory: ${{ env.WORKING_DIR }}
        run: uv run ruff check src tests api streamlit_app

      - name: Ruff format check
        working-directory: ${{ env.WORKING_DIR }}
        run: uv run ruff format --check src tests api streamlit_app

      - name: Run pipeline tests
        working-directory: ${{ env.WORKING_DIR }}
        run: uv run pytest tests -q

      - name: Run API tests
        working-directory: ${{ env.WORKING_DIR }}
        run: uv run --extra api pytest api/tests -q

      - name: MLflow smoke test
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GCP_PROJECT_ID: "ci-project"
          GCS_BUCKET_NAME: "ci-bucket"
          WANDB_API_KEY: "ci-key"
          WANDB_PROJECT: "ci-project"
        run: |
          uv run mlflow run . --env-manager local -P hydra_overrides="main.execute_steps=[]"

  train-register:
    name: Train, Sweep and Register
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch' && inputs.run_training_pipeline
    runs-on: ubuntu-latest
    outputs:
      model_name: ${{ steps.extract-model.outputs.model_name }}
      model_version: ${{ steps.extract-model.outputs.model_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: uv sync --frozen

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.GCP_PROJECT_ID }}" || (echo "Missing secret: GCP_PROJECT_ID" && exit 1)
          test -n "${{ secrets.GCS_BUCKET_NAME }}" || (echo "Missing secret: GCS_BUCKET_NAME" && exit 1)
          test -n "${{ secrets.WANDB_API_KEY }}" || (echo "Missing secret: WANDB_API_KEY" && exit 1)

      - name: Run full pipeline with MLflow
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_ENTITY: ${{ secrets.WANDB_ENTITY }}
          WANDB_PROJECT: ${{ env.WANDB_PROJECT }}
          WANDB_CONSOLE: wrap
          WANDB__SERVICE_WAIT: "300"
        run: |
          uv run mlflow run . --env-manager local -P hydra_overrides="sweep.sweep_count=${{ inputs.sweep_count }}"

      - name: Validate registration outputs
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          test -f src/model/06_sweep/best_params.yaml
          test -f configs/model_config.yaml
          test -f models/trained/housing_price_model.pkl

      - name: Extract model metadata
        id: extract-model
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          uv run python - <<'PY'
          import os
          from pathlib import Path
          import yaml

          config_path = Path("configs/model_config.yaml")
          payload = yaml.safe_load(config_path.read_text(encoding="utf-8")) or {}
          model_data = payload.get("model", {})

          model_name = str(model_data.get("name", "")).strip()
          model_version = str(model_data.get("version", "")).strip()

          if not model_name or not model_version:
              raise SystemExit("Invalid model_config.yaml: missing model name/version")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"model_name={model_name}\n")
              output.write(f"model_version={model_version}\n")
          PY

      - name: Upload pipeline artifacts
        uses: actions/upload-artifact@v6
        with:
          name: training-run-artifacts
          path: |
            ${{ env.WORKING_DIR }}/mlruns
            ${{ env.WORKING_DIR }}/mlflow.db
            ${{ env.WORKING_DIR }}/models/trained
            ${{ env.WORKING_DIR }}/configs/model_config.yaml
            ${{ env.WORKING_DIR }}/src/model/06_sweep/best_params.yaml
            ${{ env.WORKING_DIR }}/artifacts
          if-no-files-found: error
          retention-days: 30

  promote-to-production:
    name: Promote Model to Production
    needs: train-register
    if: github.event_name == 'workflow_dispatch' && inputs.run_training_pipeline && inputs.promote_to_production
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: uv sync --frozen

      - name: Download training artifacts
        uses: actions/download-artifact@v7
        with:
          name: training-run-artifacts
          path: .

      - name: Promote model version with guardrails
        working-directory: ${{ env.WORKING_DIR }}
        env:
          MLFLOW_TRACKING_URI: sqlite:///${{ github.workspace }}/cap2-end_to_end/mlflow.db
        run: |
          uv run python scripts/promote_model.py \
            --model-name "${{ needs.train-register.outputs.model_name }}" \
            --from-stage Staging \
            --to-stage Production \
            --min-r2 "${{ inputs.min_r2 }}" \
            --max-mape "${{ inputs.max_mape }}" \
            --archive-existing-production \
            --report-path artifacts/promotion/promotion_report.json

      - name: Upload promotion report
        uses: actions/upload-artifact@v6
        with:
          name: model-promotion-report
          path: |
            ${{ env.WORKING_DIR }}/artifacts/promotion/promotion_report.json
            ${{ env.WORKING_DIR }}/mlflow.db
            ${{ env.WORKING_DIR }}/mlruns
          if-no-files-found: error
          retention-days: 30

  docker-api-smoke:
    name: Docker API Smoke Test
    needs: train-register
    if: github.event_name == 'workflow_dispatch' && inputs.run_training_pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download training artifacts
        uses: actions/download-artifact@v7
        with:
          name: training-run-artifacts
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./cap2-end_to_end/api
          push: false
          load: true
          tags: housing-mlops-api:test

      - name: Run API container and health check
        run: |
          docker run -d --name housing-api-test \
            -p 8080:8080 \
            -v "${PWD}/cap2-end_to_end/models/trained:/app/models/trained" \
            -e LOCAL_MODEL_PATH="/app/models/trained/housing_price_model.pkl" \
            housing-mlops-api:test

          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done

          cat /tmp/health.json
          uv run python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/health.json").read_text(encoding="utf-8"))
          status = payload.get("status")
          if status not in {"healthy", "degraded"}:
              raise SystemExit(f"Unexpected health status: {status}")
          PY

          docker logs housing-api-test --tail 200
          docker rm -f housing-api-test

  summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - quality-gate
      - train-register
      - promote-to-production
      - docker-api-smoke

    steps:
      - name: Publish run summary
        run: |
          echo "## MLOps CI/CD Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| quality-gate | ${{ needs.quality-gate.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| train-register | ${{ needs.train-register.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| promote-to-production | ${{ needs.promote-to-production.result }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| docker-api-smoke | ${{ needs.docker-api-smoke.result }} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce final status
        run: |
          FAIL=0

          if [ "${{ needs.quality-gate.result }}" != "success" ]; then
            FAIL=1
          fi

          REQUESTED_TRAIN="${{ github.event_name == 'workflow_dispatch' && inputs.run_training_pipeline || false }}"
          REQUESTED_PROMOTION="${{ github.event_name == 'workflow_dispatch' && inputs.promote_to_production || false }}"

          if [ "$REQUESTED_TRAIN" = "true" ]; then
            if [ "${{ needs.train-register.result }}" != "success" ]; then
              FAIL=1
            fi
            if [ "${{ needs.docker-api-smoke.result }}" != "success" ]; then
              FAIL=1
            fi
          fi

          if [ "$REQUESTED_PROMOTION" = "true" ]; then
            if [ "${{ needs.promote-to-production.result }}" != "success" ]; then
              FAIL=1
            fi
          fi

          exit "$FAIL"
