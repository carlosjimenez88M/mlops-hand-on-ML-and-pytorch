name: Cap2 - Complete ML Pipeline

on:
  push:
    branches:
      - cap2-end_to_end
    paths:
      - 'cap2-end_to_end/**'
      - '.github/workflows/cap2-pipeline-complete.yaml'
  workflow_dispatch:
    inputs:
      skip_download:
        description: 'Skip data download step (use existing data)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

env:
  PYTHON_VERSION: 3.13.2
  WORKING_DIR: cap2-end_to_end

jobs:
  # ==============================================
  # JOB 1: Download Data
  # ==============================================
  download_data:
    name: Step 1 - Download Data
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_download != 'true' }}

    outputs:
      data_downloaded: ${{ steps.check_download.outputs.success }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIR }}/requirements.txt'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data download
        id: check_download
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python src/data/01_download_data/main.py \
            --file_url "https://raw.githubusercontent.com/ageron/handson-ml2/master/datasets/housing/housing.tgz" \
            --artifact_name "housing_data_raw" \
            --artifact_type "raw_data" \
            --artifact_description "California Housing - Raw data in GCS" \
            --gcs_output_path "data/01-raw/housing.csv" \
            --bucket_name "$GCS_BUCKET_NAME" \
            --wandb_project "$WANDB_PROJECT"

          echo "success=true" >> $GITHUB_OUTPUT

      - name: Verify download in GCS
        run: |
          gsutil ls gs://${{ secrets.GCS_BUCKET_NAME }}/data/01-raw/housing.csv || exit 1

  # ==============================================
  # JOB 2: Preprocessing & Imputation
  # ==============================================
  preprocessing:
    name: Step 2 - Preprocessing & Imputation
    runs-on: ubuntu-latest
    needs: [download_data]
    if: always() && (needs.download_data.result == 'success' || needs.download_data.result == 'skipped')

    outputs:
      preprocessing_done: ${{ steps.check_preprocessing.outputs.success }}
      best_imputation_method: ${{ steps.check_preprocessing.outputs.method }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIR }}/requirements.txt'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run preprocessing with auto imputation
        id: check_preprocessing
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python src/data/02_preprocessing_and_imputation/main.py \
            --input_artifact_name "housing_data_raw" \
            --gcs_input_path "data/01-raw/housing.csv" \
            --gcs_output_path "data/02-processed/housing_processed.csv" \
            --artifact_name "housing_data_processed" \
            --artifact_type "processed_data" \
            --artifact_description "California Housing - Preprocessed with auto imputation (best method selection: SimpleImputer, KNN, IterativeImputer-RF) & feature engineering" \
            --bucket_name "$GCS_BUCKET_NAME" \
            --wandb_project "$WANDB_PROJECT" \
            --imputation_strategy "auto" \
            --create_features True

          echo "success=true" >> $GITHUB_OUTPUT
          echo "method=auto" >> $GITHUB_OUTPUT

      - name: Verify preprocessing in GCS
        run: |
          gsutil ls gs://${{ secrets.GCS_BUCKET_NAME }}/data/02-processed/housing_processed.csv || exit 1

      - name: Check processed data stats
        run: |
          echo "📊 Processed Data Stats:"
          gsutil stat gs://${{ secrets.GCS_BUCKET_NAME }}/data/02-processed/housing_processed.csv

  # ==============================================
  # JOB 3: Summary Report
  # ==============================================
  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [download_data, preprocessing]
    if: always()

    steps:
      - name: Generate Pipeline Summary
        run: |
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           MLOPS PIPELINE - EXECUTION SUMMARY                 ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""
          echo "Pipeline Run: ${{ github.run_number }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Triggered by: ${{ github.event_name }}"
          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  JOB STATUS"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""

          if [ "${{ needs.download_data.result }}" == "success" ]; then
            echo "✅ Step 1: Data Download - SUCCESS"
          elif [ "${{ needs.download_data.result }}" == "skipped" ]; then
            echo "⏭️  Step 1: Data Download - SKIPPED"
          else
            echo "❌ Step 1: Data Download - FAILED"
          fi

          if [ "${{ needs.preprocessing.result }}" == "success" ]; then
            echo "✅ Step 2: Preprocessing & Imputation - SUCCESS"
            echo "   Best Method: ${{ needs.preprocessing.outputs.best_imputation_method }}"
          else
            echo "❌ Step 2: Preprocessing & Imputation - FAILED"
          fi

          echo ""
          echo "═══════════════════════════════════════════════════════════════"
          echo "  ARTIFACTS"
          echo "═══════════════════════════════════════════════════════════════"
          echo ""
          echo "📦 W&B Project: ${{ vars.WANDB_PROJECT }}"
          echo "📦 GCS Bucket: gs://${{ secrets.GCS_BUCKET_NAME }}"
          echo ""
          echo "Data locations:"
          echo "  - Raw: gs://${{ secrets.GCS_BUCKET_NAME }}/data/01-raw/housing.csv"
          echo "  - Processed: gs://${{ secrets.GCS_BUCKET_NAME }}/data/02-processed/housing_processed.csv"
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║           ✅ PIPELINE COMPLETED                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"

      - name: Check overall pipeline status
        if: ${{ needs.download_data.result == 'failure' || needs.preprocessing.result == 'failure' }}
        run: |
          echo "❌ Pipeline failed. Check logs above."
          exit 1
