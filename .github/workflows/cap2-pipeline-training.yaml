name: Cap2 - Pipeline Training

on:
  push:
    branches:
      - cap2-end_to_end
    paths:
      - 'cap2-end_to_end/**'
      - '.github/workflows/cap2-pipeline-training.yaml'
  workflow_dispatch:

env:
  PYTHON_VERSION: 3.13.2
  WORKING_DIR: cap2-end_to_end

jobs:
  download_data:
    name: Download & Upload to GCS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: '${{ env.WORKING_DIR }}/requirements.txt'

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Install dependencies
        working-directory: ${{ env.WORKING_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data download step
        working-directory: ${{ env.WORKING_DIR }}
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          WANDB_ENTITY: danieljimenez88m
        run: |
          python src/data/01_download_data/main.py \
            --file_url "https://raw.githubusercontent.com/ageron/handson-ml2/master/datasets/housing/housing.tgz" \
            --artifact_name "housing_data_raw" \
            --artifact_type "raw_data" \
            --artifact_description "California Housing - Raw data in GCS only" \
            --gcs_output_path "data/01-raw/housing.csv" \
            --bucket_name "$GCS_BUCKET_NAME" \
            --wandb_project "$WANDB_PROJECT"

      - name: Verify upload to GCS
        run: |
          gsutil ls gs://${{ secrets.GCS_BUCKET_NAME }}/data/01-raw/ || echo "Warning: Could not list GCS bucket"
