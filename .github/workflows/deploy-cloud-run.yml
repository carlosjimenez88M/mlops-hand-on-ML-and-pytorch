name: Deploy API to Cloud Run

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'cap2-end_to_end/api/**'
      - '.github/workflows/deploy-cloud-run.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  PROJECT_ID: mlops-practices-wb
  REGION: us-central1
  SERVICE_NAME: housing-prediction-api
  IMAGE_NAME: housing-mlops-api
  PYTHON_VERSION: "3.12"

jobs:
  build-and-deploy:
    name: Build and Deploy to Cloud Run
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run pre-deployment tests
        working-directory: cap2-end_to_end/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
          pytest tests/ -v || true

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        working-directory: cap2-end_to_end/api
        run: |
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-repo/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-repo/${{ env.IMAGE_NAME }}:latest \
            .

      - name: Scan Docker image for vulnerabilities
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-repo/${{ env.IMAGE_NAME }}:${{ github.sha }} || true

      - name: Push Docker image to Artifact Registry
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-repo/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-repo/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to Cloud Run (Staging)
        if: ${{ github.event.inputs.environment == 'staging' || github.event.inputs.environment == '' }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }}-staging \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-repo/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=cloudrun-mlops-api@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300s \
            --concurrency=80 \
            --min-instances=0 \
            --max-instances=10 \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCS_BUCKET_NAME=mlops-practices-wb-cap2-end_to_end,WANDB_PROJECT=housing-mlops-gcp,ENVIRONMENT=staging" \
            --set-secrets="WANDB_API_KEY=wandb-api-key:latest" \
            --allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --quiet

      - name: Deploy to Cloud Run (Production)
        if: ${{ github.event.inputs.environment == 'production' }}
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}-repo/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --service-account=cloudrun-mlops-api@${{ env.PROJECT_ID }}.iam.gserviceaccount.com \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300s \
            --concurrency=80 \
            --min-instances=1 \
            --max-instances=50 \
            --set-env-vars="GCP_PROJECT_ID=${{ env.PROJECT_ID }},GCS_BUCKET_NAME=mlops-practices-wb-cap2-end_to_end,WANDB_PROJECT=housing-mlops-gcp,ENVIRONMENT=production" \
            --set-secrets="WANDB_API_KEY=wandb-api-key:latest" \
            --no-allow-unauthenticated \
            --ingress=all \
            --port=8080 \
            --no-traffic \
            --quiet

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_NAME_DEPLOY="${{ env.SERVICE_NAME }}"
          if [ "${{ github.event.inputs.environment }}" = "staging" ] || [ -z "${{ github.event.inputs.environment }}" ]; then
            SERVICE_NAME_DEPLOY="${{ env.SERVICE_NAME }}-staging"
          fi

          SERVICE_URL=$(gcloud run services describe ${SERVICE_NAME_DEPLOY} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')

          echo "service_url=${SERVICE_URL}" >> $GITHUB_OUTPUT
          echo "Service URL: ${SERVICE_URL}"

      - name: Test health endpoint
        run: |
          sleep 10
          curl -f ${{ steps.get-url.outputs.service_url }}/health || exit 1

      - name: Test prediction endpoint (staging only)
        if: ${{ github.event.inputs.environment == 'staging' || github.event.inputs.environment == '' }}
        run: |
          curl -f -X POST ${{ steps.get-url.outputs.service_url }}/api/v1/predict \
            -H "Content-Type: application/json" \
            -d '{
              "longitude": -122.23,
              "latitude": 37.88,
              "housing_median_age": 41,
              "total_rooms": 880,
              "total_bedrooms": 129,
              "population": 322,
              "households": 126,
              "median_income": 8.3252,
              "ocean_proximity": "NEAR BAY"
            }' || exit 1

      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ github.event.inputs.environment || 'staging' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_NAME }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Service URL:** ${{ steps.get-url.outputs.service_url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region:** ${{ env.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Health Check" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          curl -s ${{ steps.get-url.outputs.service_url }}/health | jq . >> $GITHUB_STEP_SUMMARY || echo "Failed to fetch health" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  rollback:
    name: Rollback (Manual)
    runs-on: ubuntu-latest
    needs: [build-and-deploy]
    if: failure() && github.event_name == 'workflow_dispatch'
    environment: rollback

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Rollback to previous revision
        run: |
          SERVICE_NAME_DEPLOY="${{ env.SERVICE_NAME }}"
          if [ "${{ github.event.inputs.environment }}" = "staging" ]; then
            SERVICE_NAME_DEPLOY="${{ env.SERVICE_NAME }}-staging"
          fi

          # Get previous revision
          PREVIOUS_REVISION=$(gcloud run revisions list \
            --service=${SERVICE_NAME_DEPLOY} \
            --region=${{ env.REGION }} \
            --limit=2 \
            --format='value(name)' | tail -n 1)

          echo "Rolling back to: ${PREVIOUS_REVISION}"

          # Route 100% traffic to previous revision
          gcloud run services update-traffic ${SERVICE_NAME_DEPLOY} \
            --region=${{ env.REGION }} \
            --to-revisions=${PREVIOUS_REVISION}=100

      - name: Notify rollback
        run: |
          echo "## Rollback Completed" >> $GITHUB_STEP_SUMMARY
          echo "Service has been rolled back to previous stable revision" >> $GITHUB_STEP_SUMMARY
