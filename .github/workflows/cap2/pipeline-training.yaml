name: Pipeline Training workflow

on:
  push:
    branches:
      - cap2-end_to_end
  workflow_dispatch:

env:
  PYTHON_VERSION: 3.13.2
  MLFLOW_TRACKING_URI: http://mlflow-server:5000

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

  download_data:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r cap2-end_to_end/requirements.txt

      - name: Run data download step
        env:
          GCS_BUCKET_NAME: ${{ secrets.GCS_BUCKET_NAME }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
          WANDB_PROJECT: ${{ vars.WANDB_PROJECT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: |
          python cap2-end_to_end/src/data/01_download_data/main.py \
            --file_url "https://raw.githubusercontent.com/ageron/handson-ml2/master/datasets/housing/housing.tgz" \
            --artifact_name "housing_data_raw" \
            --artifact_type "raw_data" \
            --artifact_description "California Housing - Raw data in GCS only" \
            --gcs_output_path "data/01-raw/housing.csv" \
            --bucket_name "$GCS_BUCKET_NAME" \
            --wandb_project "$WANDB_PROJECT"
