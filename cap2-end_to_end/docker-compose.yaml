# =================================================================
# Docker Compose for MLOps Pipeline Development
# Purpose: Run API and services locally
# Author: Carlos Daniel Jiménez
# =================================================================

version: '3.8'

services:
  # FastAPI Model Prediction Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: housing-price-api
    ports:
      - "8080:8080"
    environment:
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME:-}
      - GCP_PROJECT_ID=${GCP_PROJECT_ID:-}
      - WANDB_PROJECT=${WANDB_PROJECT:-housing-mlops-gcp}
      - PORT=8080
    env_file:
      - .env
    volumes:
      - ./api/app:/app/app:ro
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
    name: housing-mlops-network
