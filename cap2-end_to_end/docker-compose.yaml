# =================================================================
# Docker Compose for MLOps Pipeline Development
# Purpose: Run API and services locally
# Author: Carlos Daniel Jiménez
# =================================================================

services:
  # FastAPI Model Prediction Service
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: housing-price-api
    ports:
      - "8080:8080"
    environment:
      # API Configuration
      - PORT=8080
      - PROJECT_NAME=Housing Price Prediction API
      - VERSION=1.0.0
      # Model loading - Local is the primary method in Docker
      - LOCAL_MODEL_PATH=/app/models/trained/housing_price_model.pkl
      # Optional: GCS credentials (if using GCS model loading)
      - GCS_BUCKET=${GCS_BUCKET_NAME:-}
      - GCS_MODEL_PATH=models/trained/housing_price_model.pkl
      # Optional: MLflow (if using MLflow model registry)
      - MLFLOW_MODEL_NAME=${MLFLOW_MODEL_NAME:-}
      - MLFLOW_MODEL_STAGE=${MLFLOW_MODEL_STAGE:-Production}
      - MLFLOW_TRACKING_URI=${MLFLOW_TRACKING_URI:-}
      # W&B for prediction logging
      - WANDB_API_KEY=${WANDB_API_KEY}
      - WANDB_PROJECT=${WANDB_PROJECT:-housing-mlops-api}
    env_file:
      - .env
    volumes:
      # Mount application code for development (read-only in production)
      - ./api/app:/app/app:ro
      # Mount models directory (CRITICAL: must contain trained model)
      - ./models:/app/models:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mlops-network
    # Resource limits (optional but recommended for production)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

networks:
  mlops-network:
    driver: bridge
    name: housing-mlops-network
