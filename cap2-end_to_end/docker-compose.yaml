services:
  # FastAPI Model Service
  model:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: house-price-model
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - mlops-network

  # Streamlit Frontend Service
  streamlit:
    build:
      context: ./streamlit_app
      dockerfile: Dockerfile
    container_name: house-price-streamlit
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://model:8000
      - APP_VERSION=1.0.0
    depends_on:
      model:
        condition: service_healthy
    networks:
      - mlops-network

networks:
  mlops-network:
    driver: bridge
