# =================================================================
# MLOps Pipeline Configuration
# Author: Carlos Daniel Jiménez
# Date: 2026-01-13
# =================================================================

main:
  project_name: "housing-mlops-gcp"
  experiment_name: "end_to_end_pipeline"
  execute_steps:
    - "01_download_data"
    - "02_preprocessing_and_imputation"
    - "03_feature_engineering"
    - "04_segregation"
    - "05_model_selection"
    - "06_sweep"
    - "07_registration"

# Hydra configuration
hydra:
  run:
    dir: .
  job:
    chdir: false

# =================================================================
# Step 1: Download Data Configuration
# =================================================================
download_data:
  file_url: "https://raw.githubusercontent.com/ageron/handson-ml2/master/datasets/housing/housing.tgz"
  artifact_name: "housing_data_raw"
  artifact_type: "raw_data"
  artifact_description: "California Housing - Raw data downloaded from source"
  gcs_output_path: "data/01-raw/housing.parquet"

# =================================================================
# Step 2: Preprocessing and Imputation Configuration
# =================================================================
preprocessing:
  input_artifact_name: "housing_data_raw:latest"
  gcs_input_path: "data/01-raw/housing.parquet"
  gcs_output_path: "data/02-processed/housing_processed.parquet"
  artifact_name: "housing_data_processed"
  artifact_type: "processed_data"
  artifact_description: "California Housing - Preprocessed with automatic imputation"
  imputation_strategy: "auto"  # Options: auto, median, mean, mode, drop
  create_features: "True"  # Create engineered features

# =================================================================
# GCS Configuration (loaded from environment variables)
# =================================================================
gcs:
  # These will be loaded from .env file
  bucket_name: ${oc.env:GCS_BUCKET_NAME}
  project_id: ${oc.env:GCP_PROJECT_ID}
  region: ${oc.env:GCP_REGION,us-central1}

# =================================================================
# Weights & Biases Configuration (loaded from environment variables)
# =================================================================
wandb:
  project: ${oc.env:WANDB_PROJECT,housing-mlops-gcp}
  entity: ${oc.env:WANDB_ENTITY,null}

# =================================================================
# Future Steps Configuration (placeholder)
# =================================================================

# Feature Engineering
feature_engineering:
  input_artifact_name: "housing_data_processed:latest"
  gcs_input_path: "data/02-processed/housing_processed.parquet"
  gcs_output_path: "data/03-features/housing_features.parquet"
  artifact_name: "housing_features"
  artifact_type: "engineered_features"
  artifact_description: "California Housing - Feature engineered data with clustering"
  n_clusters: 10
  gamma: 0.1
  random_state: 42
  optimize_hyperparams: "True"  # Set to "False" to disable optimization

# Data Segregation (Train/Test Split)
segregation:
  input_artifact_name: "housing_features:latest"
  gcs_input_path: "data/03-features/housing_features.parquet"
  gcs_train_output_path: "data/04-split/train/train.parquet"
  gcs_test_output_path: "data/04-split/test/test.parquet"
  artifact_root: "housing_data"
  artifact_type: "segregated_data"
  artifact_description: "California Housing - Train/Test split"
  test_size: 0.2
  random_state: 42
  target_column: "median_house_value"

# Model Selection
model_selection:
  train_artifact_name: "housing_data_train:latest"
  test_artifact_name: "housing_data_test:latest"
  gcs_train_path: "data/04-split/train/train.parquet"
  gcs_test_path: "data/04-split/test/test.parquet"
  artifact_name: "best_model_selection"
  artifact_type: "model"
  artifact_description: "Best model selected from multiple algorithms"
  target_column: "median_house_value"
  random_state: 42

# Hyperparameter Sweep (Step 06)
sweep:
  train_artifact_name: "housing_data_train:latest"
  test_artifact_name: "housing_data_test:latest"
  gcs_train_path: "data/04-split/train/train.parquet"
  gcs_test_path: "data/04-split/test/test.parquet"
  best_model_type: "RandomForest"
  sweep_count: 50
  metric_name: "mape"
  metric_goal: "minimize"
  target_column: "median_house_value"

# Model Registration (Step 07)
# IMPORTANT: This step reads best hyperparameters from sweep results
# Path is relative to the sweep module directory (src/model/06_sweep/)
registration:
  gcs_train_path: "data/04-split/train/train.parquet"
  gcs_test_path: "data/04-split/test/test.parquet"
  best_params_path: "src/model/06_sweep/best_params.yaml"  # Generated by sweep step
  registered_model_name: "housing_price_model"
  model_stage: "Staging"
  target_column: "median_house_value"
  models_output_path: "models/production"
