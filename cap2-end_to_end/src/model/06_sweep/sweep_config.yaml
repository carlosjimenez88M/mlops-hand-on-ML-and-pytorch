# =================================================================
# W&B Sweep Configuration for Random Forest Hyperparameter Tuning
# Author: Carlos Daniel Jiménez
# =================================================================

program: main.py
method: bayes  # Bayesian optimization for efficient search

# Primary optimization metric
metric:
  name: wmape  # Weighted MAPE (less biased than MAPE, better for aggregates)
  goal: minimize

parameters:
  n_estimators:
    min: 50
    max: 500

  max_depth:
    min: 5
    max: 30

  min_samples_split:
    min: 2
    max: 20

  min_samples_leaf:
    min: 1
    max: 10

  max_features:
    values: ['sqrt', 'log2']

# Improved Early Stopping Configuration
# Hyperband algorithm eliminates poorly performing runs early
early_terminate:
  type: hyperband
  min_iter: 10   # Minimum runs before early termination (increased from 5)
  eta: 3         # Proportion of runs to eliminate (1/3 kept, increased from 2)
  s: 2           # Bracket size

# Additional metrics to track (logged but not optimized)
# These help understand model behavior even if not the primary optimization target
# - mape: Standard percentage error (biased toward low values)
# - smape: Symmetric MAPE (less biased)
# - wmape: Weighted MAPE (primary metric)
# - median_ape: Robust to outliers
# - within_10pct: Prediction accuracy threshold
# - feature_importance_*: Top 10 most important features

name: housing-rf-sweep-improved
description: "Optimize Random Forest with comprehensive metrics and feature importance tracking"
