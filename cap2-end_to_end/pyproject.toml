[project]
name = "housing-mlops-pipeline"
version = "0.1.0"
description = "MLOps pipeline for California Housing dataset"
authors = [
    {name = "Carlos Daniel Jiménez", email = "danieljimenez88m@gmail.com"}
]
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pip>=24.0",
    "mlflow>=2.10.0",
    "hydra-core>=1.3.0",
    "wandb==0.19.1",
    "google-cloud-storage==2.19.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pandas==2.2.3",
    "numpy==2.2.1",
    "scikit-learn==1.6.1",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "python-dotenv==1.2.1",
    "omegaconf>=2.3.0",
    "pyarrow>=14.0.0",
    "pytest==8.3.4",
    "pytest-cov==6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers --tb=short"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "**/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]
